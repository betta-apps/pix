name: CI

# The unit tests and lint, on every pull request.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Checks the wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The SDK pieces the build names, from Google's pinned command-line tools.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"
          scripts/android-sdk.sh "$RUNNER_TOOL_CACHE/android-sdk"
      - run: ./gradlew testDebugUnitTest lintDebug
