name: Release

# A version tag (v1.2.3) builds Pix from this repository's code, signs it with Pix's release key and publishes the
# APK as a GitHub release, with the signing certificate's fingerprint to check it against.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds the release key, for v* tags only.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Checks the wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Android SDK
        run: |
          # GitHub's runner names its own SDK in ANDROID_SDK_ROOT too, and Gradle refuses two: both point at this one.
          echo "ANDROID_HOME=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"
          scripts/android-sdk.sh "$RUNNER_TOOL_CACHE/android-sdk"
      - name: Build and sign
        env:
          KEYSTORE: ${{ secrets.PIX_RELEASE_KEYSTORE }}
          PIX_RELEASE_PASSWORD: ${{ secrets.PIX_RELEASE_PASSWORD }}
          PIX_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export PIX_RELEASE_STORE="$RUNNER_TEMP/pix-release.jks"
          trap 'rm -f "$PIX_RELEASE_STORE"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$PIX_RELEASE_STORE"
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts || { echo "The tag says $version; app/build.gradle.kts doesn't."; exit 1; }
          # Unit tests exist for the debug build only; they run the same code.
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "pix-$version.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner"
          cert="$("$apksigner" verify --print-certs "pix-$version.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          printf 'Pix %s for Android TV. Install it as the README describes.\n\nSigning certificate SHA-256: `%s`\n' "$version" "$cert" > notes.md
          gh release create "$GITHUB_REF_NAME" "pix-$version.apk" --title "Pix $version" --notes-file notes.md
